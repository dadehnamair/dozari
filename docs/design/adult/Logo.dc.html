<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;display=swap" rel="stylesheet">
<style>
@keyframes lg-pop{0%{transform:scale(0) rotate(-10deg)}60%{transform:scale(1.12,.9) rotate(2deg)}80%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
@keyframes lg-wobble{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-1.5deg) scale(1.025)}}
@keyframes lg-drop{0%{transform:translateY(-260%) rotate(-540deg);opacity:0}15%{opacity:1}55%{transform:translateY(0) rotate(0) scale(1.15,.8)}70%{transform:translateY(-35%) scale(.95,1.08)}85%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes lg-flip{0%,70%,100%{transform:scaleX(1)}80%{transform:scaleX(.1)}90%{transform:scaleX(1)}}
@keyframes lg-shine{0%{transform:translateX(-200px) skewX(-20deg)}40%,100%{transform:translateX(760px) skewX(-20deg)}}
@keyframes lg-spark{0%{transform:translate(0,0) scale(0);opacity:0}20%{opacity:1;transform:translate(calc(var(--x)*.4),calc(var(--y)*.4)) scale(1.2)}100%{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
</style>
</helmet>
<div style="position:relative;width:100%;aspect-ratio:700/220;direction:ltr">
  <div style="position:absolute;left:50%;top:50%;width:0;height:0">
    <div style="position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:#FF4D8D;border:2px solid #2B1240;--x:-260%;--y:-420%;animation:lg-spark .9s ease-out .55s both"></div>
    <div style="position:absolute;width:4%;aspect-ratio:1;border-radius:4px;background:#3FC1F0;border:2px solid #2B1240;--x:900%;--y:-380%;animation:lg-spark .9s ease-out .6s both"></div>
    <div style="position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:#7ED957;border:2px solid #2B1240;--x:1100%;--y:250%;animation:lg-spark .9s ease-out .58s both"></div>
    <div style="position:absolute;width:4%;aspect-ratio:1;border-radius:4px;background:#FFC93C;border:2px solid #2B1240;--x:-1200%;--y:200%;animation:lg-spark .9s ease-out .62s both"></div>
    <div style="position:absolute;width:4%;aspect-ratio:1;border-radius:50%;background:#A66BF0;border:2px solid #2B1240;--x:300%;--y:500%;animation:lg-spark .9s ease-out .57s both"></div>
    <div style="position:absolute;width:5%;aspect-ratio:1;border-radius:4px;background:#FF7A3D;border:2px solid #2B1240;--x:-700%;--y:-600%;animation:lg-spark .9s ease-out .6s both"></div>
  </div>
  <div style="position:absolute;inset:0;animation:lg-pop .7s cubic-bezier(.34,1.56,.64,1) .45s both">
    <div style="position:absolute;inset:0;animation:lg-wobble 3.2s ease-in-out 1.3s infinite">
      <svg viewBox="-90 0 700 220" width="100%" height="100%" style="overflow:visible;display:block">
        <defs>
          <linearGradient id="lgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6A8"></stop><stop offset=".5" stop-color="#FFC93C"></stop><stop offset="1" stop-color="#FF7A3D"></stop></linearGradient>
          <clipPath id="lgC"><text x="260" y="156" text-anchor="middle" font-family="Lalezar" font-size="168">دوزاری</text></clipPath>
        </defs>
        <text x="260" y="168" text-anchor="middle" font-family="Lalezar" font-size="168" fill="#2B1240" stroke="#2B1240" stroke-width="26" stroke-linejoin="round">دوزاری</text>
        <text x="260" y="156" text-anchor="middle" font-family="Lalezar" font-size="168" fill="url(#lgG)" stroke="#2B1240" stroke-width="14" stroke-linejoin="round" paint-order="stroke">دوزاری</text>
        <g clip-path="url(#lgC)"><rect x="-90" y="-20" width="60" height="260" fill="rgba(255,255,255,.8)" style="animation:lg-shine 3.6s ease-in-out 1.4s infinite"></rect></g>
      </svg>
    </div>
  </div>
  <div style="position:absolute;left:-3%;top:2%;width:17%;aspect-ratio:1;animation:lg-drop 1s cubic-bezier(.5,0,.5,1) 0s both">
    
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:140}}"></script>
</body>
</html>
