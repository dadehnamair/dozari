<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>یادگار · سری اول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1600px; height: 1360px; box-sizing: border-box; padding: 64px; display: flex; flex-direction: column; gap: 48px; background: radial-gradient(ellipse at 50% 0%, #3a1a52 0%, #1a0b2a 55%, #0f0619 100%); font-family: Vazirmatn, Tahoma, sans-serif; color: #fff6e8">

  <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font: 800 14px/1 Vazirmatn, sans-serif; color: #e0b04a; letter-spacing: 2px">مجموعهٔ کلکسیونی دوزاری · سری اول</div>
      <h1 style="margin: 0; font: 112px/1 Lalezar, Vazirmatn, sans-serif; color: #e0b04a; text-shadow: 0 3px 0 #6a4410, 0 14px 30px rgba(0,0,0,.5)">یادگار</h1>
      <p style="margin: 0; font: 600 18px/1.9 Vazirmatn, sans-serif; color: rgba(255,246,232,.8); max-width: 640px">هشت عکس از روزهای قدیم، هر کدوم تکه‌تکه. تکه‌ها رو جمع کن، عکس رو کامل کن و مُهرش رو بزن به پروفایلت.</p>
    </div>
    <div style="display: flex; gap: 14px; align-items: center">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 20px; border-radius: 18px; border: 1.5px solid rgba(224,176,74,.6)">
        <div style="font: 34px/1 Lalezar, Vazirmatn, sans-serif; color: #e0b04a">۴ تکه</div>
        <div style="font: 600 13px/1 Vazirmatn, sans-serif; color: rgba(255,246,232,.7)">چهار کارت · قاب گرد</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 20px; border-radius: 18px; background: linear-gradient(180deg, rgba(255,241,184,.18), rgba(224,176,74,.08)); border: 1.5px solid #e0b04a">
        <div style="font: 34px/1 Lalezar, Vazirmatn, sans-serif; color: #fff1b8">۶ تکه</div>
        <div style="font: 600 13px/1 Vazirmatn, sans-serif; color: rgba(255,246,232,.7)">چهار کارت کمیاب · قاب کنگره‌ای</div>
      </div>
    </div>
  </header>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 32px; justify-items: center">
    <dc-import name="YCard" card="1" title="تلفن عمومی" line="یه دوزاری می‌نداختی و صدای بوق آزاد می‌اومد." num="شمارهٔ ۰۱ از ۰۸" pieces="۴ تکه" tilt="-1.5deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="2" title="چای عصر جمعه" line="سماور قل‌قل می‌کرد و استکان‌ها کمرباریک بودن." num="شمارهٔ ۰۲ از ۰۸" pieces="۴ تکه" tilt="1.2deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="3" title="شب یلدا" line="کرسی، انار دون‌شده و فال حافظ تا نیمه‌شب." num="شمارهٔ ۰۳ از ۰۸" pieces="۶ تکه" rare="{{ yes }}" tilt="-1deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="4" title="بادبادک پشت‌بوم" line="باد که می‌اومد، همه می‌رفتیم پشت‌بوم." num="شمارهٔ ۰۴ از ۰۸" pieces="۴ تکه" tilt="1.6deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="5" title="تیله‌بازی" line="یه تیلهٔ آبی داشتم که با هیچی عوضش نمی‌کردم." num="شمارهٔ ۰۵ از ۰۸" pieces="۴ تکه" tilt="1deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="6" title="بستنی سنتی" line="بستنی زعفرونی لای دو تا نون، ظهر تابستون." num="شمارهٔ ۰۶ از ۰۸" pieces="۶ تکه" rare="{{ yes }}" tilt="-1.4deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="7" title="سفر با پیکان" line="بار روی باربند، جادهٔ چالوس، صندلی عقب جای ما." num="شمارهٔ ۰۷ از ۰۸" pieces="۶ تکه" rare="{{ yes }}" tilt="1.3deg" hint-size="340px,540px"></dc-import>
    <dc-import name="YCard" card="8" title="نوار کاست" line="نوار رو با مداد برمی‌گردوندیم که پاره نشه." num="شمارهٔ ۰۸ از ۰۸" pieces="۶ تکه" rare="{{ yes }}" tilt="-1.2deg" hint-size="340px,540px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true };
  }
}
</script>
</body>
</html>
