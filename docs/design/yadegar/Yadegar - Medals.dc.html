<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>مُهرهای پروفایل یادگار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1600px; height: 620px; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 36px; background: radial-gradient(ellipse at 50% 100%, #3a1a52 0%, #1a0b2a 60%, #0f0619 100%); font-family: Vazirmatn, Tahoma, sans-serif; color: #fff6e8">
  <header style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font: 56px/1.1 Lalezar, Vazirmatn, sans-serif; color: #e0b04a">مُهرهای پروفایل</h2>
      <p style="margin: 0; font: 600 16px/1.9 Vazirmatn, sans-serif; color: rgba(255,246,232,.75)">هر کارتی که کامل بشه، مُهر اختصاصی خودش رو به پروفایل بازیکن اضافه می‌کنه.</p>
    </div>
    <div style="display: flex; gap: 24px; font: 600 14px/1.6 Vazirmatn, sans-serif; color: rgba(255,246,232,.75)">
      <span>قاب گرد طلایی: کارت ۴ تکه</span>
      <span style="color: #fff1b8">قاب کنگره‌ای با نگین: کارت ۶ تکهٔ کمیاب</span>
    </div>
  </header>
  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 16px; justify-items: center">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div role="img" aria-label="مُهر {{ it.title }}" style="width: 160px; height: 160px"><dc-import name="Yadegar" card="{{ it.card }}" mode="medal" hint-size="160px,160px" style="width: 100%; height: 100%"></dc-import></div>
        <div style="font: 22px/1.2 Lalezar, Vazirmatn, sans-serif; color: #fff6e8; text-align: center">{{ it.title }}</div>
        <div style="font: 600 12px/1 Vazirmatn, sans-serif; color: rgba(255,246,232,.55)">{{ it.num }}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['تلفن عمومی'],
      ['چای عصر جمعه'],
      ['شب یلدا'],
      ['بادبادک پشت‌بوم'],
      ['تیله‌بازی'],
      ['بستنی سنتی'],
      ['سفر با پیکان'],
      ['نوار کاست']
    ];
    const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
    return { items: rows.map(([title], i) => ({ card: String(i + 1), title, num: '۰' + fa(i + 1) + ' از ۰۸' })) };
  }
}
</script>
</body>
</html>
