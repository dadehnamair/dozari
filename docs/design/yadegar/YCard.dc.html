<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>کارت یادگار</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 340px; height: 540px; box-sizing: border-box; position: relative; border-radius: 22px; background: linear-gradient(160deg, #2b1240 0%, #1a0b2a 55%, #120820 100%); box-shadow: inset 0 0 0 1px #e0b04a, inset 0 0 0 7px #1a0b2a, inset 0 0 0 8px rgba(224,176,74,.55), 0 18px 34px rgba(0,0,0,.45); padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 12px; font-family: Vazirmatn, Tahoma, sans-serif; color: #fff6e8; overflow: hidden">
  <svg viewBox="0 0 24 24" width="22" height="22" style="position: absolute; top: 12px; right: 12px" aria-hidden="true"><path d="M12 1l2.6 6.2L21 5l-2.2 6.4L23 12l-4.2.6L21 19l-6.4-2.2L12 23l-2.6-6.2L3 19l2.2-6.4L1 12l4.2-.6L3 5l6.4 2.2z" fill="#e0b04a" opacity=".85"></path><circle cx="12" cy="12" r="3.2" fill="#2b1240"></circle></svg>
  <svg viewBox="0 0 24 24" width="22" height="22" style="position: absolute; top: 12px; left: 12px" aria-hidden="true"><path d="M12 1l2.6 6.2L21 5l-2.2 6.4L23 12l-4.2.6L21 19l-6.4-2.2L12 23l-2.6-6.2L3 19l2.2-6.4L1 12l4.2-.6L3 5l6.4 2.2z" fill="#e0b04a" opacity=".85"></path><circle cx="12" cy="12" r="3.2" fill="#2b1240"></circle></svg>
  <svg viewBox="0 0 24 24" width="22" height="22" style="position: absolute; bottom: 12px; right: 12px" aria-hidden="true"><path d="M12 1l2.6 6.2L21 5l-2.2 6.4L23 12l-4.2.6L21 19l-6.4-2.2L12 23l-2.6-6.2L3 19l2.2-6.4L1 12l4.2-.6L3 5l6.4 2.2z" fill="#e0b04a" opacity=".85"></path><circle cx="12" cy="12" r="3.2" fill="#2b1240"></circle></svg>
  <svg viewBox="0 0 24 24" width="22" height="22" style="position: absolute; bottom: 12px; left: 12px" aria-hidden="true"><path d="M12 1l2.6 6.2L21 5l-2.2 6.4L23 12l-4.2.6L21 19l-6.4-2.2L12 23l-2.6-6.2L3 19l2.2-6.4L1 12l4.2-.6L3 5l6.4 2.2z" fill="#e0b04a" opacity=".85"></path><circle cx="12" cy="12" r="3.2" fill="#2b1240"></circle></svg>

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 18px">
    <div style="font: 24px/1 Lalezar, Vazirmatn, sans-serif; color: #e0b04a; letter-spacing: .5px">یادگار</div>
    <div style="font: 600 12px/1 Vazirmatn, sans-serif; color: rgba(255,246,232,.6)">{{ num }}</div>
  </div>

  <div style="display: flex; justify-content: center; padding-top: 2px">
    <div role="img" aria-label="{{ title }}" style="width: 270px; height: 353px; transform: rotate({{ tilt }}); filter: drop-shadow(0 10px 14px rgba(0,0,0,.55))"><dc-import name="Yadegar" card="{{ card }}" mode="photo" hint-size="270px,353px" style="width: 100%; height: 100%"></dc-import></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px; text-align: center">
    <div style="font: 30px/1.15 Lalezar, Vazirmatn, sans-serif; color: #fff6e8">{{ title }}</div>
    <div style="font: 400 13px/1.8 Vazirmatn, sans-serif; color: rgba(255,246,232,.72)">{{ line }}</div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 0 16px">
    <div style="display: flex; gap: 6px; align-items: center">
      <span style="font: 800 12px/1 Vazirmatn, sans-serif; padding: 6px 12px; border-radius: 99px; border: 1.5px solid #e0b04a; color: #e0b04a">{{ pieces }}</span>
      <sc-if value="{{ rare }}" hint-placeholder-val="{{ false }}">
        <span style="font: 800 12px/1 Vazirmatn, sans-serif; padding: 7px 12px; border-radius: 99px; background: linear-gradient(180deg, #fff1b8, #e0b04a 55%, #a8741e); color: #2b1240">کمیاب</span>
      </sc-if>
    </div>
    <div role="img" aria-label="مُهر {{ title }}" style="width: 40px; height: 40px"><dc-import name="Yadegar" card="{{ card }}" mode="medal" hint-size="40px,40px" style="width: 100%; height: 100%"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"card":{"editor":"enum","options":["1","2","3","4","5","6","7","8"],"default":"1"},"title":{"editor":null,"default":"تلفن عمومی"},"line":{"editor":null,"default":"یه دوزاری می‌نداختی و صدای بوق آزاد می‌اومد."},"num":{"editor":null,"default":"شمارهٔ ۰۱ از ۰۸"},"pieces":{"editor":null,"default":"۴ تکه"},"rare":{"editor":"boolean","default":false},"tilt":{"editor":null,"default":"-1.5deg"},"$preview":{"width":340,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      card: String(p.card ?? '1'),
      title: p.title ?? 'تلفن عمومی',
      line: p.line ?? 'یه دوزاری می‌نداختی و صدای بوق آزاد می‌اومد.',
      num: p.num ?? 'شمارهٔ ۰۱ از ۰۸',
      pieces: p.pieces ?? '۴ تکه',
      rare: p.rare === true || p.rare === 'true',
      tilt: p.tilt ?? '-1.5deg'
    };
  }
}
</script>
</body>
</html>
