<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>مُهرهای یادگار در پروفایل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 20px; display: flex; flex-direction: column; gap: 22px; background: linear-gradient(165deg, #2a0e52 0%, #4a1670 50%, #1a0b2a 100%); font-family: Vazirmatn, Tahoma, sans-serif; color: #fff6e8">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px">
    <div style="position: relative; width: 112px; height: 112px">
      <div style="width: 112px; height: 112px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #ffe48a, #ffc93c 60%, #c48a0e); border: 4px solid #fff6e8; box-sizing: border-box; display: grid; place-items: center; font: 52px/1 Lalezar, Vazirmatn, sans-serif; color: #2b1240">ع</div>
      <div role="img" aria-label="مُهر ویژه: شب یلدا" style="position: absolute; bottom: -10px; left: -14px; width: 56px; height: 56px"><dc-import name="Yadegar" card="3" mode="medal" hint-size="56px,56px" style="width: 100%; height: 100%"></dc-import></div>
    </div>
    <div style="font: 30px/1.2 Lalezar, Vazirmatn, sans-serif">[نام بازیکن]</div>
    <div style="font: 600 13px/1.6 Vazirmatn, sans-serif; color: rgba(255,246,232,.7)">مُهر ویژه: شب یلدا</div>
  </div>

  <section style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 28px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(224,176,74,.45)">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h3 style="margin: 0; font: 26px/1.2 Lalezar, Vazirmatn, sans-serif; color: #e0b04a">یادگارها</h3>
      <span style="font: 800 14px/1 Vazirmatn, sans-serif; color: #fff6e8">۵ از ۸</span>
    </div>
    <div style="height: 10px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden">
      <div style="width: 62.5%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #a8741e, #e0b04a, #fff1b8)"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; justify-items: center">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{ it.op }}">
          <div role="img" aria-label="{{ it.alt }}" style="width: 70px; height: 70px; filter: {{ it.filter }}"><dc-import name="Yadegar" card="{{ it.card }}" mode="medal" hint-size="70px,70px" style="width: 100%; height: 100%"></dc-import></div>
          <div style="font: 600 11px/1.3 Vazirmatn, sans-serif; text-align: center; color: rgba(255,246,232,.85)">{{ it.label }}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <a href="Yadegar - Album.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 20px; border: 3px solid #2b1240; background: linear-gradient(180deg, #fff1b8, #e0b04a 60%, #a8741e); box-shadow: 0 6px 0 #2b1240; font: 22px/1 Lalezar, Vazirmatn, sans-serif; color: #2b1240; text-decoration: none">دیدن آلبوم یادگار</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['تلفن عمومی', true],
      ['چای عصر جمعه', true],
      ['شب یلدا', true],
      ['بادبادک پشت‌بوم', true],
      ['تیله‌بازی', true],
      ['بستنی سنتی', false],
      ['سفر با پیکان', false],
      ['نوار کاست', false]
    ];
    return {
      items: rows.map(([title, have], i) => ({
        card: String(i + 1),
        label: have ? title : '۲ تکه مونده',
        alt: have ? 'مُهر ' + title : 'مُهر ' + title + '، هنوز کامل نشده',
        op: have ? 1 : 0.55,
        filter: have ? 'none' : 'grayscale(1) brightness(.6)'
      }))
    };
  }
}
</script>
</body>
</html>
