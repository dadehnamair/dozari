<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:512,&quot;height&quot;:512},&quot;who&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;man&quot;,&quot;woman&quot;],&quot;default&quot;:&quot;man&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rounded&quot;,&quot;full&quot;,&quot;fg&quot;,&quot;bg&quot;],&quot;default&quot;:&quot;rounded&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:512,&quot;min&quot;:16,&quot;max&quot;:1024,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, who = p.who ?? 'man';
    let rays = '';
    for (let i = 0; i < 20; i++) {
      const a = i / 20 * Math.PI * 2, w = Math.PI / 20 * .5, pt = t => `${(256 + Math.cos(t) * 520).toFixed(1)} ${(220 + Math.sin(t) * 520).toFixed(1)}`;
      rays += `M256 220 L${pt(a - w)} L${pt(a + w)} Z `;
    }
    const mode = p.mode ?? 'rounded', ch = mode !== 'bg';
    return { px: +(p.size ?? 512), manOn: ch && who !== 'woman', womanOn: ch && who === 'woman', rays,
      showBg: mode !== 'fg', showFrame: mode === 'rounded',
      clipId: mode === 'rounded' ? 'icClip' : mode === 'fg' ? 'icSafe' : 'icSq',
      charT: mode === 'fg' ? 'translate(256 256) scale(.66) translate(-256 -256)' : '' };
  }
}
</script>
