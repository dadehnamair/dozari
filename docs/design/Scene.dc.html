<sc-for list="{{ flags }}" as="f" hint-placeholder-count="10"><path d="{{ f.d }}" fill="{{ f.c }}" stroke-width="2"></path></sc-for>
<path d="M0 844 V700 h60 v-30 h40 v30 h30 C130 640 210 640 210 700 h40 v-50 h16 v50 h40 v-24 h60 v24 h24 V844Z" fill="#E8743B"></path>
<path d="M20 740 h20 v24 h-20Z M150 730 C150 716 170 716 170 730 v20 h-20Z M300 720 h16 v20 h-16Z M340 740 h16 v20 h-16Z" fill="#7A3418"></path>
</sc-if>
</g>


<sc-if value="{{ dusk }}" hint-placeholder-val="{{ false }}"><rect width="390" height="844" fill="#27306E" opacity=".55" style="mix-blend-mode:multiply"></rect></sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bazaar&quot;,&quot;alley&quot;,&quot;hojre&quot;,&quot;caravan&quot;,&quot;win&quot;],&quot;default&quot;:&quot;bazaar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;day&quot;,&quot;dusk&quot;],&quot;default&quot;:&quot;day&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const RAYS=(()=>{let d='';const cx=195,cy=380,R=900;for(let i=0;i<18;i++){const a=i*20*Math.PI/180,b=(i*20+10)*Math.PI/180;
d+=`M${cx} ${cy} L${(cx+R*Math.cos(a)).toFixed(0)} ${(cy+R*Math.sin(a)).toFixed(0)} L${(cx+R*Math.cos(b)).toFixed(0)} ${(cy+R*Math.sin(b)).toFixed(0)}Z `;}return d;})();
const FLAGS=Array.from({length:11},(_,i)=>{const t=(i+.5)/11,x=-10+410*t,y=90+80*4*t*(1-t)*1;return {d:`M${(x-12).toFixed(1)} ${(y-2).toFixed(1)} L${(x+12).toFixed(1)} ${(y-2).toFixed(1)} L${x.toFixed(1)} ${(y+24).toFixed(1)}Z`,c:['#FF4D8D','#3FC1F0','#7ED957','#A66BF0','#FFF6E8'][i%5]};});
class Component extends DCLogic {
  renderVals(){
    if(!this.uid){window.__dzs=(window.__dzs||0)+1;this.uid='dzs'+window.__dzs;}
    const s=this.props.scene??'bazaar';
    return {u:this.uid,seed:7,seed2:13,rays:RAYS,flags:FLAGS,dusk:this.props.mood==='dusk',
      is:{bazaar:s==='bazaar',alley:s==='alley',hojre:s==='hojre',caravan:s==='caravan',win:s==='win'}};
  }
}
</script>
</body>
</html>
