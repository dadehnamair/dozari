<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header dir="rtl" style="position:sticky;top:0;z-index:20;background:#FFF6E8;border-bottom:4px solid #2B1240">
  <div style="max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <a href="Dozari Site - Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#2B1240">
      <div style="width:48px;height:48px;border-radius:50%;overflow:hidden;background:#FFC93C;border:3px solid #2B1240;flex:none">
        <dc-import name="Character" who="dozari" pose="idle" crop="face" hint-size="48px,48px" style="width:48px;height:48px"></dc-import>
      </div>
      <span style="font:34px/1 Lalezar">دوزاری</span>
    </a>
    <nav style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="font:800 15px Vazirmatn;padding:8px 16px;border-radius:999px;text-decoration:none;color:#2B1240;background:{{ l.bg }};border:3px solid {{ l.bd }}">{{ l.fa }}</a>
      </sc-for>
    </nav>
    <a href="Dozari Site - Download.dc.html" style="font:22px Lalezar;padding:10px 22px 8px;border:3px solid #2B1240;border-radius:999px;background:#FF4D8D;color:#FFF6E8;text-decoration:none;box-shadow:0 4px 0 #2B1240">دانلود رایگان</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;blog&quot;,&quot;download&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const L = [['home','خانه','Home'],['about','درباره ما','About'],['blog','وبلاگ','Blog'],['download','دانلود','Download'],['contact','تماس و سوالات','Contact']];
    return { links: L.map(([k,fa,f]) => ({ fa, href:`Dozari Site - ${f}.dc.html`, bg: k===a?'#FFC93C':'transparent', bd: k===a?'#2B1240':'transparent' })) };
  }
}
</script>
</body>
</html>
