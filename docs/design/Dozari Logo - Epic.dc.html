<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    let d = '', cx = 300, cy = 235, n = 18;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, w = Math.PI / n * 0.55;
      const p = (t, r) => `${(cx + Math.cos(t) * r).toFixed(1)} ${(cy + Math.sin(t) * r).toFixed(1)}`;
      d += `M${cx} ${cy} L${p(a - w, 420)} L${p(a + w, 420)} Z `;
    }
    return { rays: d };
  }
}
</script>
