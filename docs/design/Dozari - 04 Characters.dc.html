<!DOCTYPE html>
<html>

<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2B1240;font-family:Vazirmatn,system-ui,sans-serif;color:#FFF6E8}
a{color:#FFC93C}a:hover{color:#FF7A3D}
*{box-sizing:border-box}
button{font-family:inherit}
@keyframes dz-spin{to{transform:rotate(360deg)}}
@keyframes dz-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes dz-shine{0%{transform:translateX(-200%) skewX(-20deg)}55%,100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes dz-flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.08)}}
@keyframes dz-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
@keyframes dz-pulse{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.18);opacity:1}}
@keyframes dz-ring{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes dz-fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(170px) rotate(600deg)}}
@keyframes dz-twinkle{0%,100%{transform:scale(.25) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes dz-flicker{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.12)}}
@keyframes dz-load{0%{width:6%}100%{width:94%}}
@keyframes dz-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes dz-drop{0%{transform:translateY(-60px);opacity:0}10%{opacity:1}100%{transform:translateY(380px);opacity:.9}}
</style>
</helmet>

<div dir="rtl" style="min-height:100vh;background:linear-gradient(180deg,#2B1240 0%,#40166A 30%,#5E1F7E 60%,#8E2A6E 85%,#C2413F 100%);padding:56px 56px 80px;display:flex;flex-direction:column;gap:36px;max-width:1600px;margin:0 auto">

<header style="display:flex;flex-direction:column;gap:4px"><div style="font:14px 'JetBrains Mono',monospace;color:#FFC93C;direction:ltr;text-align:right">Dozari · 04 Characters</div><h1 style="margin:0;font:56px/1 Lalezar;color:#FFF6E8;text-shadow:0 4px 0 #2B1240">شخصیت‌ها</h1></header>
<!-- D MASCOT -->
<section style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:36px;padding:40px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#FFE48A,#FFC93C);box-shadow:inset 0 3px 0 rgba(255,255,255,.6),0 5px 0 #C48A0E;display:grid;place-items:center;font:30px Lalezar;color:#2B1240">D</div>
    <div><h2 style="margin:0;font:38px/1.1 Lalezar">شخصیت‌های بازار</h2><div style="font:13px Vazirmatn;color:rgba(255,246,232,.7)">هشت شخصیت با خط مدادی لرزان، رنگ تخت، گونهٔ صورتی و هایلایت سفید. سر، چشم، دهان و دست‌ها لایهٔ جدا برای Rive/Spine.</div></div>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap">
    <sc-for list="{{ cast }}" as="c" hint-placeholder-count="7">
      <div style="width:172px;padding:14px 12px 16px;border-radius:26px;background:#FBF1DE;border:3px solid #3A2418;box-shadow:0 6px 0 #3A2418;display:flex;flex-direction:column;align-items:center;gap:4px;color:#3A2418">
        <div style="width:148px;height:170px"><dc-import name="Character" who="{{ c.k }}" pose="{{ c.pose }}" hint-size="148px,170px" style="width:148px;height:170px"></dc-import></div>
        <div style="font:24px/1.1 Lalezar">{{ c.fa }}</div>
        <div style="font:500 12.5px/1.6 Vazirmatn;text-align:center;opacity:.8;text-wrap:pretty">{{ c.d }}</div>
        <div style="font:10.5px 'JetBrains Mono',monospace;opacity:.55">char-{{ c.k }}</div>
      </div>
    </sc-for>
  </div>
  <div style="font:700 12px 'JetBrains Mono',monospace;color:#FFC93C;margin-top:8px">char-dozari · poses</div>
  <div style="display:flex;gap:14px;flex-wrap:wrap">
    <sc-for list="{{ poses }}" as="p" hint-placeholder-count="12">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center;width:132px">
        <div style="width:132px;height:150px;border-radius:22px;background:#FBF1DE;border:3px solid #3A2418;display:grid;place-items:center;padding:8px">
          <dc-import name="Character" who="dozari" pose="{{ p.k }}" hint-size="112px,130px" style="width:112px;height:130px"></dc-import>
        </div>
        <div style="font:700 11px 'JetBrains Mono',monospace">{{ p.k }}</div>
        <div style="font:12px Vazirmatn;color:rgba(255,246,232,.65)">{{ p.fa }}</div>
      </div>
    </sc-for>
  </div>

  <div style="font:700 12px 'JetBrains Mono',monospace;color:#FFC93C;margin-top:8px">char-dozariF · poses</div>
  <div style="display:flex;gap:14px;flex-wrap:wrap">
    <sc-for list="{{ poses }}" as="p" hint-placeholder-count="12">
      <div style="display:flex;flex-direction:column;gap:6px;align-items:center;width:132px">
        <div style="width:132px;height:150px;border-radius:22px;background:#FBF1DE;border:3px solid #3A2418;display:grid;place-items:center;padding:8px">
          <dc-import name="Character" who="dozariF" pose="{{ p.k }}" hint-size="112px,130px" style="width:112px;height:130px"></dc-import>
        </div>
        <div style="font:700 11px 'JetBrains Mono',monospace">{{ p.k }}</div>
        <div style="font:12px Vazirmatn;color:rgba(255,246,232,.65)">{{ p.fa }}</div>
      </div>
    </sc-for>
  </div>
</section>



</div>
</x-dc>

const GROUPS=[{name:'پرندگان',words:['کلاغ','طوطی','عقاب','قناری'],c:'#F9DF6D',d:'#C9A92A'},{name:'سازهای ایرانی',words:['تار','سنتور','دف','نی'],c:'#A0C35A',d:'#6E9030'},
{name:'شهرهای ایران',words:['یزد','کرمان','رشت','تبریز'],c:'#B0C4EF',d:'#6F88C4'},{name:'فصل‌ها',words:['بهار','تابستان','پاییز','زمستان'],c:'#BA81C5',d:'#8A4F98'}];

const rnd=(a,b,i)=>a+((Math.sin(i*12.9898)*43758.5453)%1+1)%1*(b-a);

const CAST_INFO=[['dozari','دوزاری','قهرمان بازی؛ بچهٔ زرنگ بازار که همیشه یه سکه تو جیبشه','coin'],['dozariF','دوزاری خانم','نسخهٔ دخترِ قهرمان؛ همان کلاه و شال، با گیس و دامن','wave'],['mashti','عمو مشتی','پیرمرد حجره‌دار؛ راهنمای مرحله‌ها','idle'],['khale','خاله قزی','صاحب دکهٔ ادویه؛ جایزهٔ روزانه','wave'],['pahlevan','پهلوون','حریف دوئل‌ها؛ زورخانه','angry'],['baqal','اوس‌ممد بقال','فروشگاه سکه و آیتم','pointing'],['mirza','میرزا','کاتب؛ پیشنهاد و رأی پازل‌ها','thinking'],['goli','گلی','هم‌تیمی؛ بخش تیمی و دعوت','cheer']];

const AV_P=['idle','wave','cheer','thinking','shocked','blink','win','sleeping'];
class Component extends DCLogic {
  state={scan:0,ticks:0,tiles:shuf(ALL),sel:[],solved:[],mistakes:0,shake:false,toast:'',over:null,coins:2213};
  componentDidMount(){this._scan=setInterval(()=>this.setState(s=>({scan:(s.scan+5+Math.floor(Math.random()*7))%16,ticks:(s.ticks||0)+1})),450);}

  flash(t){this.setState({toast:t});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({toast:''}),1300);}
  toggle(w){const s=this.state;if(s.over)return;const on=s.sel.includes(w);if(!on&&s.sel.length>=4)return;this.setState({sel:on?s.sel.filter(x=>x!==w):[...s.sel,w]});}
  submit(){const s=this.state;if(s.sel.length!==4||s.over)return;
    const gi=GROUPS.findIndex(g=>s.sel.every(w=>g.words.includes(w)));

      if(solved.length===4)setTimeout(()=>this.setState({over:'win'}),700);}
    else{const near=GROUPS.some(g=>s.sel.filter(w=>g.words.includes(w)).length===3);const m=s.mistakes+1;
      this.setState({mistakes:m,shake:true});setTimeout(()=>this.setState({shake:false}),500);this.flash(near?'یکی مونده!':'نه، این نبود');

    const s=this.state;const solvedW=s.solved.flatMap(i=>GROUPS[i].words);
    const tiles=s.tiles.filter(w=>!solvedW.includes(w)).map(w=>{const on=s.sel.includes(w);return {w,onClick:()=>this.toggle(w),

    const win=s.over==='win';

    const bubble=s.shake?'اوه! حواست باشه…':s.sel.length===4?'مطمئنی؟ بزن «ثبت کن»!':s.sel.length?'چهارتا کلمهٔ هم‌گروه پیدا کن.':s.solved.length?'دوزاریت داره می‌افته! ادامه بده.':'۱۶ کلمه، ۴ گروه. شروع کن!';
    return {
      tiles, rows:s.solved.map(i=>({name:GROUPS[i].name,words:GROUPS[i].words.join('، '),c:GROUPS[i].c,d:GROUPS[i].d})),
      lives:[0,1,2,3].map(i=>({bg:i<4-s.mistakes?'#FF4D8D':'rgba(255,255,255,.18)'})),
      shakeAnim:s.shake?'dz-shake .45s ease-in-out':'none', subOp:s.sel.length===4?1:.55, subFilter:s.sel.length===4?'none':'saturate(.4)',
      toast:s.toast, over:!!s.over, mPose, bubble, coins:fa(s.coins).replace(/(\S)(\S{3})$/,'$1٬$2'),
      overTitle:win?'دوزاریت افتاد!':'این دفعه نشد', overSub:win?'+۱۰۰ سکه · رکورد جدید':'فردا یه پازل تازه داریم',
      rayC:win?'rgba(255,201,60,.28)':'rgba(176,196,239,.16)', banC:win?'linear-gradient(180deg,#FFE48A,#FFC93C)':'linear-gradient(180deg,#D4E0FA,#B0C4EF)',
      submit:()=>this.submit(), clear:()=>this.setState({sel:[]}), shuffle:()=>this.setState({tiles:shuf(s.tiles)}), reset:()=>this.reset(),
      tabs:[['فروشگاه','gift'],['رتبه‌ها','trophy'],['خانه','home'],['تیم','users'],['تنظیمات','settings']].map(([n,k])=>({n,d:I[k],on:k==='home',sz:k==='home'?34:26})),
      corners:[
        {top:'146px',right:'10px',left:'auto',items:[['روزانه','calendar',C.yellow,'!','#FF4D8D'],['تیم','users',C.sky,'',''],['رتبه‌ها','trophy',C.orange,'','']]},
        {top:'146px',left:'10px',right:'auto',items:[['تنظیمات','settings',C.grape,'',''],['پیام‌ها','mail',C.pink,'۳','#7ED957'],['فروشگاه','gift',C.lime,'جدید','#FF4D8D']]}
      ].map(c=>({...c,items:c.items.map(([n,k,cl,badge,bc])=>({n,d2:I[k],l:cl.l,b:cl.b,d:cl.d,badge,bc}))})),
      confetti:CONF, rain:RAIN, splashes:SPL,
      cast:CAST_INFO.map(([k,fa,d,pose])=>({k,fa,d,pose})),
      searchRows:[C.pink,C.grape,C.sky,C.orange].map((rc,r)=>({l:rc.l,b:rc.d,cards:[0,1,2,3].map(k=>{const i=r*4+k,on=i===s.scan,cc=CL[(i*7+1)%6];
        return {n:PLAYERS[i],lv:fa(3+(i*7)%28),skin:i%7,pose:AV_P[i%8],l:cc.l,b:cc.b,frame:on?'#FFC93C':'#2B1240',on,z:on?2:1,
          tr:on?'scale(1.12) rotate(-3deg)':'none',glow:on?'0 0 0 3px #2B1240,0 0 22px 6px rgba(255,201,60,.85)':'0 0 0 0 transparent'};})})),
      scanName:PLAYERS[s.scan], scanC:CL[(s.scan*7+1)%6],
      searchTime:'در حال جستجو… '+fa('0:'+String(Math.floor(s.ticks*0.45)%60).padStart(2,'0')),
      poses:POSES.map(([k,f])=>({k,fa:f})),
      portals:[['portal-solo','تک‌نفره','user',C.grape],['portal-duel','دوئل','bolt',C.pink],['portal-team','تیمی','users',C.sky],['portal-private','خصوصی','lock',C.orange],
        ['portal-daily','روزانه','calendar',C.yellow],['portal-ugc-suggest','پیشنهاد پازل','edit',C.lime],['portal-ugc-vote','رأی بده','vote',C.pink],
        ['portal-leaderboard','جدول','chart',C.sky],['portal-achievements','افتخارات','trophy',C.yellow],['portal-wallet','کیف سکه','wallet',C.grape]]
        .map(([k,f,ic,c],i)=>({k,fa:f,ic:I[ic],l:c.l,b:c.b,d:c.d,dl:(i*.35)+'s'})),
