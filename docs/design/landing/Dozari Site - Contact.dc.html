<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>تماس با ما و سوالات متداول · دوزاری</title>
<meta name="description" content="پاسخ سوالات متداول دربارهٔ بازی دوزاری و راه‌های تماس با تیم.">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&amp;family=Vazirmatn:wght@400;600;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFF6E8;font-family:Vazirmatn,system-ui,sans-serif;color:#2B1240}a{color:#A66BF0}a:hover{color:#FF4D8D}</style>
</helmet>
<div dir="rtl" style="background:#FFF6E8;min-height:100vh">
<dc-import name="SiteNav" active="contact" hint-size="100%,80px"></dc-import>

<section style="max-width:1200px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:20px">
    <h1 style="margin:0;font:clamp(44px,5vw,64px)/1.1 Lalezar">سوالات متداول</h1>
    <sc-for list="{{ faq }}" as="q" hint-placeholder-count="6">
      <div style="background:#fff;border:4px solid #2B1240;border-radius:24px;overflow:hidden">
        <button onClick="{{ q.toggle }}" style="all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;font:800 17px Vazirmatn;background:{{ q.bg }}">
          <span>{{ q.q }}</span><span style="font:28px/1 Lalezar">{{ q.sign }}</span>
        </button>
        <sc-if value="{{ q.open }}" hint-placeholder-val="{{ false }}">
          <p style="margin:0;padding:0 22px 20px;font:500 16px/1.9 Vazirmatn;background:{{ q.bg }};text-wrap:pretty">{{ q.a }}</p>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:20px;position:sticky;top:110px">
    <div style="background:#FF7A3D;border:4px solid #2B1240;border-radius:32px;box-shadow:0 8px 0 #2B1240;padding:28px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;background:#FFC93C;border:3px solid #2B1240;flex:none">
          <dc-import name="Character" who="khale" pose="wave" crop="face" hint-size="72px,72px" style="width:72px;height:72px"></dc-import>
        </div>
        <h2 style="margin:0;font:36px/1.1 Lalezar">برامون پیام بفرست</h2>
      </div>
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFF6E8;border:3px solid #2B1240;border-radius:20px;padding:20px;font:800 17px/1.8 Vazirmatn">پیامت رسید! معمولاً تا ۴۸ ساعت جواب می‌دیم.</div>
      </sc-if>
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <input placeholder="اسمت" style="font:600 16px Vazirmatn;padding:14px 16px;border:3px solid #2B1240;border-radius:16px;background:#FFF6E8;color:#2B1240;outline:none">
          <input placeholder="ایمیل یا شماره موبایل" style="font:600 16px Vazirmatn;padding:14px 16px;border:3px solid #2B1240;border-radius:16px;background:#FFF6E8;color:#2B1240;outline:none">
          <select style="font:600 16px Vazirmatn;padding:14px 16px;border:3px solid #2B1240;border-radius:16px;background:#FFF6E8;color:#2B1240">
            <option>پشتیبانی بازی</option><option>پیشنهاد کلمه</option><option>همکاری و تبلیغات</option><option>رسانه</option>
          </select>
          <textarea rows="4" placeholder="پیامت رو بنویس…" style="font:600 16px/1.8 Vazirmatn;padding:14px 16px;border:3px solid #2B1240;border-radius:16px;background:#FFF6E8;color:#2B1240;outline:none;resize:vertical"></textarea>
          <button onClick="{{ send }}" style="font:24px Lalezar;padding:12px 16px 8px;border:3px solid #2B1240;border-radius:999px;background:#2B1240;color:#FFF6E8;cursor:pointer">ارسال پیام</button>
        </div>
      </sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;font:700 15px Vazirmatn">
      <div style="display:flex;justify-content:space-between;background:#fff;border:3px solid #2B1240;border-radius:18px;padding:14px 18px"><span>ایمیل</span><span style="font-family:'JetBrains Mono',monospace;direction:ltr">hello@dozari.ir</span></div>
      <div style="display:flex;justify-content:space-between;background:#fff;border:3px solid #2B1240;border-radius:18px;padding:14px 18px"><span>تلگرام پشتیبانی</span><span style="font-family:'JetBrains Mono',monospace;direction:ltr">@dozari_support</span></div>
    </div>
  </div>
</section>

<dc-import name="SiteFooter" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: 0, sent: false };
  renderVals() {
    const F = [
      ['دوزاری رایگانه؟','بله. کل بازی رایگانه و همهٔ مرحله‌ها با بازی کردن باز می‌شن. فقط بعضی آیتم‌های تزئینی رو می‌شه با سکه یا خرید درون‌برنامه گرفت.'],
      ['بدون اینترنت هم می‌شه بازی کرد؟','مرحله‌های اصلی آفلاین کار می‌کنن. چالش روزانه، دوئل و همگام‌سازی پیشرفت به اینترنت نیاز دارن.'],
      ['پیشرفتم رو چطور به گوشی جدید ببرم؟','از بخش تنظیمات بازی با شماره موبایل وارد شو؛ پیشرفتت روی هر دستگاهی برمی‌گرده.'],
      ['یه کلمه رو قبول نکرد، چیکار کنم؟','از دکمهٔ «گزارش کلمه» داخل مرحله استفاده کن یا از فرم همین صفحه برامون بفرست.'],
      ['برای بچه‌ها مناسبه؟','بله. محتوای بازی برای همهٔ سن‌ها بررسی شده و تبلیغ نامناسب نداره.'],
      ['چطور با تیم همکاری کنم؟','از فرم تماس، موضوع «همکاری و تبلیغات» رو انتخاب کن تا تیم مربوطه جواب بده.']
    ];
    const o = this.state.open;
    return {
      faq: F.map(([q,a],i) => ({ q, a, open: i===o, sign: i===o?'−':'+', bg: i===o?'#FFC93C':'#fff', toggle: () => this.setState({ open: i===o ? -1 : i }) })),
      sent: this.state.sent, notSent: !this.state.sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
