services:
  s-dozari-mysql:
    container_name: c-dozari-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dozari
      MYSQL_USER: dozari
      MYSQL_PASSWORD: dozari
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-udozari', '-pdozari']
      interval: 5s
      timeout: 5s
      retries: 10

  s-dozari-adminer:
    container_name: c-dozari-adminer
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: s-dozari-mysql
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - s-dozari-mysql

  # S3-compatible object storage for product images (dev stand-in for ArvanCloud Object Storage).
  s-dozari-minio:
    container_name: c-dozari-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: dozari
      MINIO_ROOT_PASSWORD: dozari-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
