# Example for an nginx that already owns ports 80/443 on the host. Adapt the certificate paths (or let certbot add
# them: `sudo certbot --nginx -d 2oi.ir -d api.2oi.ir`). Nginx Proxy Manager / Caddy / Traefik users: the same
# two forwards, with "Websockets support" ticked for the API host.

# The web app (PWA) -> the `web` container.
server {
    listen 80;
    server_name 2oi.ir;
    # Short links (2oi.ir/s/<code>, D172) are answered by the game server, which needs the original Host header.
    location /s/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;          # WEB_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# phpMyAdmin -> the `phpmyadmin` container. Put a password or an IP allow-list in front of it (here: basic auth).
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/.pma-htpasswd <user>
server {
    listen 80;
    server_name pma.2oi.ir;                      # any domain you like
    auth_basic "phpMyAdmin";
    auth_basic_user_file /etc/nginx/.pma-htpasswd;
    client_max_body_size 256m;
    location / {
        proxy_pass http://127.0.0.1:8082;           # PMA_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The game server (REST, admin panel, product images and Socket.io) -> the `server` container.
server {
    listen 80;
    server_name api.2oi.ir;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # websockets (live duels, chat)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                   # keep idle sockets open
    }
}
