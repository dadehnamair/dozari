# Example for an nginx that already owns ports 80/443 on the host. Adapt the certificate paths (or let certbot add
# them: `sudo certbot --nginx -d mrbots.ir -d api.mrbots.ir`). Nginx Proxy Manager / Caddy / Traefik users: the same
# two forwards, with "Websockets support" ticked for the API host.

# The web app (PWA) -> the `web` container.
server {
    listen 80;
    server_name mrbots.ir;
    location / {
        proxy_pass http://127.0.0.1:8081;          # WEB_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# The game server (REST, admin panel, product images and Socket.io) -> the `server` container.
server {
    listen 80;
    server_name api.mrbots.ir;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # websockets (live duels, chat)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                   # keep idle sockets open
    }
}
