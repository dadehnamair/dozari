# Production stack: MySQL (private), the game server, and the web app (static, plain HTTP on loopback).
# https and the domains are the host's existing reverse proxy's job (docs/deploy.md, Reverse proxy).
#   cp deploy/.env.example .env.prod  &&  edit it
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Steps and upkeep: docs/deploy.md
services:
  s-dozari-mysql:
    container_name: c-dozari-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dozari
      MYSQL_USER: dozari
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-udozari', '-p${MYSQL_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
    # No published ports: only the server reaches it, over the compose network.

  # Applies the database migrations (safe to repeat) and exits; the server starts after it succeeds.
  s-dozari-migrate:
    container_name: c-dozari-migrate
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: dozari-server
    working_dir: /app/packages/db
    command: ['pnpm', 'exec', 'tsx', 'src/migrate.ts']
    restart: 'no'
    depends_on:
      s-dozari-mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://dozari:${MYSQL_PASSWORD}@s-dozari-mysql:3306/dozari

  # Seeds after the migrations; it never changes an existing product (the database owns the catalogue). SEED_ON_START in .env.prod:
  #   empty (default) = fresh install gets products; a live catalogue only gets landing content, keepsakes and curated puzzles;
  #   1 = run the full seed on every `up` (still never touches existing products);  0 = never. Check the result with `logs s-dozari-seed`.
  s-dozari-seed:
    container_name: c-dozari-seed
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: dozari-server
    working_dir: /app/packages/db
    command:
      [
        'sh',
        '-c',
        'case "$$SEED_ON_START" in 1) pnpm exec tsx src/seed/run.ts ;; 0) echo "SEED_ON_START=0, skipping seed" ;; *) pnpm exec tsx src/seed/run.ts --if-empty ;; esac',
      ]
    restart: 'no'
    depends_on:
      s-dozari-mysql:
        condition: service_healthy
      s-dozari-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql://dozari:${MYSQL_PASSWORD}@s-dozari-mysql:3306/dozari
      SEED_ON_START: ${SEED_ON_START:-empty}

  s-dozari-server:
    container_name: c-dozari-server
    # Same build as `s-dozari-migrate` (cached): a service with only `image:` would make compose try to pull it.
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: dozari-server
    restart: unless-stopped
    depends_on:
      s-dozari-mysql:
        condition: service_healthy
      s-dozari-migrate:
        condition: service_completed_successfully
      s-dozari-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://dozari:${MYSQL_PASSWORD}@s-dozari-mysql:3306/dozari
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random chars)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN (long random value)}
      CORS_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN},https://${MINIAPP_DOMAIN:-${BALE_APP_DOMAIN:-mini-app.mrbots.ir}},null
      TRUST_PROXY: '1'
      LOCAL_IMAGES_DIR: /data/images
      LOCAL_IMAGES_PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN}/images
      SENTRY_DSN: ${SENTRY_DSN:-}
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_GAPGPT_API_KEY: ${AI_GAPGPT_API_KEY:-}
      AI_AVALAI_API_KEY: ${AI_AVALAI_API_KEY:-}
      AI_CUSTOM_BASE_URL: ${AI_CUSTOM_BASE_URL:-}
      AI_CUSTOM_API_KEY: ${AI_CUSTOM_API_KEY:-}
      AI_CUSTOM_NAME: ${AI_CUSTOM_NAME:-}
      AI_CUSTOM_MODEL: ${AI_CUSTOM_MODEL:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      IRNOTI_API_KEY: ${IRNOTI_API_KEY:-}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-}
    volumes:
      - images:/data/images
    # Loopback only: the host's reverse proxy forwards the API domain here (websockets on).
    ports:
      - '3000:3000'

  # phpMyAdmin for the same MySQL. Loopback only (host port PMA_PORT, default 8082): the host's reverse proxy forwards a domain of your
  # choice to it. Log in with the database user (dozari / MYSQL_PASSWORD) or root. Protect the domain (basic auth / IP allow-list) —
  # anyone who reaches this page can try passwords against the database.
  s-dozari-phpmyadmin:
    container_name: c-dozari-phpmyadmin
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      s-dozari-mysql:
        condition: service_healthy
    environment:
      PMA_HOST: s-dozari-mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 256M
      MEMORY_LIMIT: 512M
    ports:
      - '${PMA_PORT:-8082}:80'

  s-dozari-web:
    container_name: c-dozari-web
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - s-dozari-server
    # Plain HTTP on the host's loopback: the reverse proxy already on the server (which owns 80/443) forwards the app
    # domain here and the API domain to 127.0.0.1:3000. Nothing in this stack binds 80 or 443.
    ports:
      - '${WEB_PORT:-8081}:80'

  # Landing site (mrdozari.ir): server-rendered pages and blog, content managed in the game's admin panel (D173). No database of its own:
  # it reads the game server over the compose network. Loopback only; the host's reverse proxy forwards LANDING_DOMAIN here.
  s-dozari-landing:
    container_name: c-dozari-landing
    build:
      context: .
      dockerfile: deploy/Dockerfile.landing
    restart: unless-stopped
    depends_on:
      - s-dozari-server
    environment:
      PORT: 3100
      API_URL: http://s-dozari-server:3000
      SITE_URL: https://${LANDING_DOMAIN:-mrdozari.ir}
    ports:
      - '${LANDING_PORT:-8083}:3100'

  # Mini-app (docs/logic/miniapp.md): the same game, opened inside Bale (or Telegram) and logged in through the messenger's signed initData
  # (needs BALE_BOT_TOKEN on the server). Own build, own container, own domain; loopback only, the host's reverse proxy forwards
  # MINIAPP_DOMAIN here. The messenger's bot father needs this domain as the mini-app address.
  s-dozari-miniapp:
    container_name: c-dozari-miniapp
    build:
      context: .
      dockerfile: deploy/Dockerfile.miniapp
      args:
        API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - s-dozari-server
    ports:
      - '${MINIAPP_PORT:-${BALE_APP_PORT:-8084}}:80'

volumes:
  mysql-data:
  images:
