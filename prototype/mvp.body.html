<title>دوزاری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    color-scheme:dark;
    --paper:#10141A; --surface:#181E27; --ink:#E5E9EE; --muted:#96A1B1; --line:#29323E;
    --accent:#3AB3BC; --accent-ink:#0C1115; --card:#232B36; --card-hover:#2B3441;

:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10141A; --surface:#181E27; --ink:#E5E9EE; --muted:#96A1B1; --line:#29323E;
  --accent:#3AB3BC; --accent-ink:#0C1115; --card:#232B36; --card-hover:#2B3441;
  --sel:#E5E9EE; --sel-ink:#10141A; --bot:#E3B04B; --danger:#EF6E66; --ok:#6CC47C;
  --s1:#FF7A5C; --s2:#63A4FF; --s3:#5CCB7E; --s4:#C28CFF; --shadow:none;

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:15px/1.6 "Vazirmatn",Tahoma,"Segoe UI",sans-serif;direction:rtl;padding-inline:16px;padding-block:18px 64px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:"Lalezar","Vazirmatn",serif;font-size:34px;line-height:1;margin:0;letter-spacing:0}
.logo span{color:var(--accent)}
.coins{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 10px;font-weight:700}
.coin-dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE58A,#D9A520);box-shadow:inset 0 0 0 1.5px #B8860B}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 0}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tabs small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}

.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;transition:border-color .2s}
.side.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.side.bot.active{border-color:var(--bot);box-shadow:0 0 0 1px var(--bot)}
.side .who{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.side .score{font-size:22px;font-weight:800;line-height:1.2}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.8}
.dot.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);opacity:.6}
.clock{text-align:center;font-weight:800;font-size:20px;min-width:56px}
.clock small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.turnbar{height:4px;background:var(--card);border-radius:4px;overflow:hidden;grid-column:1/-1}
.turnbar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.solo-status{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13.5px}

.solved{display:flex;flex-direction:column;gap:8px}
.row{border-radius:12px;padding:10px 12px;color:var(--on-group);text-align:center;animation:pop .35s ease}
.row h3{margin:0;font-size:15.5px;font-weight:800;text-wrap:balance}
.row p{margin:2px 0 0;font-size:13px}
.row .ex{font-size:12px;opacity:.8;margin-top:4px}
.row .by{font-size:11.5px;font-weight:700;opacity:.75;margin-top:4px}
.lv0{background:var(--y)}.lv1{background:var(--g)}.lv2{background:var(--b)}.lv3{background:var(--p)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{border:0;background:var(--card);border-radius:10px;aspect-ratio:1/1;max-width:100%;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:12.5px;line-height:1.35;text-align:center;transition:background .12s,transform .12s}
.card .e{font-size:26px;line-height:1}
.card:hover{background:var(--card-hover)}
.card[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);transform:translateY(-2px)}
.card.botpick{background:var(--bot);color:var(--paper)}
.card.shake{animation:shake .4s}
.card:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.taunts{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px}
.chip:disabled{opacity:.4}
.chatlog{display:flex;flex-direction:column;gap:6px;min-height:34px}
.msg{max-width:85%;padding:6px 11px;border-radius:14px;font-size:13.5px;background:var(--card);align-self:flex-start}
.msg.me{align-self:flex-start;background:var(--accent);color:var(--accent-ink)}
.msg.bot{align-self:flex-end}
.msg b{font-size:11px;display:block;opacity:.75;font-weight:700}
.lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.lock input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit}

.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.verdict{font-family:"Lalezar","Vazirmatn",serif;font-size:30px;line-height:1.1;margin:0}
.delta{font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px;background:var(--card)}
.delta.plus{color:var(--ok)}.delta.minus{color:var(--danger)}
.gtabs{display:flex;gap:6px;flex-wrap:wrap}
.gtab{border:2px solid transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--on-group)}
.gtab[aria-selected="true"]{border-color:var(--ink)}
.chart-box{overflow-x:auto;direction:ltr}
.chart-box svg{display:block;width:100%;min-width:320px;height:auto}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:14px;height:4px;border-radius:2px;flex:none}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);margin-inline-start:auto;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);margin:0}

details.logic{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details.logic summary{cursor:pointer;font-weight:700;font-size:14px}
.checks{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.checks li{display:flex;gap:8px}
.checks .ok{color:var(--ok);font-weight:800}.checks .bad{color:var(--danger);font-weight:800}
.checks code{font-size:11.5px;direction:ltr;unicode-bidi:isolate;color:var(--muted);word-break:break-all}
.checks li>span:last-child{min-width:0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:420px){.card{font-size:11px}.card .e{font-size:22px}.logo{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1 class="logo">قیمتش <span>چند</span> بود؟</h1>
    <div class="coins num" title="سکه‌ها"><span class="coin-dot"></span><span id="coins">۲۰۰</span></div>
  </header>
  <p class="sub">۱۶ جنس قدیمی رو توی ۴ دسته‌ی چهارتایی بچین. دسته‌ها از روی قیمت و زمونه‌شون ساخته شدن.</p>

  <div class="tabs" role="tablist">

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
// ---------- data (illustrative, nominal toman) ----------
const YEARS = [1360,1365,1370,1375,1380,1385,1390,1395,1400];
const P = {
  gum:{n:'آدامس خروس‌نشان',e:'🍬',t:['dahe-60'],s:[0.5,1,2,10,30,60,150,300,500]},

  taxi:{n:'کرایه تاکسی خطی',e:'🚕',t:['dahe-70'],s:[2,5,20,100,150,250,500,1000,5000]},

  falafel:{n:'ساندویچ فلافل',e:'🥙',t:['dahe-80'],s:[5,20,150,250,600,1200,3000,8000,30000]},
  book:{n:'کتاب جیبی',e:'📚',t:['dahe-80'],s:[20,50,200,500,900,2000,5000,15000,60000]},
  orange:{n:'یک کیلو پرتقال',e:'🍊',t:['dahe-80'],s:[10,30,150,250,500,1100,2500,6000,25000]},
  coin:{n:'سکه بهار آزادی',e:'🪙',t:[],s:[4000,9000,14000,50000,70000,190000,700000,1200000,12000000]},
  gold:{n:'یک گرم طلای ۱۸',e:'💍',t:[],s:[400,800,1500,5000,6000,20000,80000,120000,1200000]},
  apt:{n:'یک متر آپارتمان تهران',e:'🏢',t:[],s:[2000,8000,30000,90000,150000,600000,2500000,5000000,32000000]},
  meat:{n:'یک کیلو گوشت',e:'🥩',t:[],s:[100,250,500,1600,3000,6000,15000,40000,280000]},

  pencil:{n:'مداد سوسمارنشان',e:'✏️',t:['madrese'],s:[0.5,2,8,20,50,100,300,800,3000]},
  eraser:{n:'پاک‌کن جوهری',e:'🧽',t:['madrese'],s:[0.5,3,10,25,60,150,400,1000,4000]},
  ruler:{n:'خط‌کش ۳۰ سانتی',e:'📐',t:['madrese'],s:[1,3,10,40,100,300,600,1500,5000]},
  bag:{n:'کیف مدرسه',e:'🎒',t:['madrese'],s:[100,300,1500,5000,12000,30000,90000,250000,1100000]},
  sandwich:{n:'ساندویچ کالباس',e:'🥪',t:[],s:[5,30,60,150,300,500,1500,4000,15000]},
  milk:{n:'شیر پاکتی یک لیتری',e:'🥛',t:[],s:[3,8,20,60,200,450,1000,2500,9000]},
  chips:{n:'چیپس',e:'🥔',t:[],s:[null,10,30,80,250,500,1200,3000,10000]},
  famsoda:{n:'نوشابه خانواده',e:'🍾',t:[],s:[5,15,40,150,300,550,1500,3500,15000]},
  egg:{n:'یک دونه تخم‌مرغ',e:'🥚',t:[],s:[2,5,10,25,40,70,150,500,2000]},
  bus:{n:'بلیت اتوبوس واحد',e:'🚌',t:[],s:[2,5,5,10,25,50,100,300,1000]},
  lavash:{n:'نون لواش',e:'🫓',t:[],s:[2,5,5,10,25,50,100,300,1500]},
  stamp:{n:'تمبر پست',e:'✉️',t:[],s:[2,5,10,20,50,150,300,700,2000]},
  washer:{n:'ماشین لباسشویی',e:'🧺',t:[],s:[8000,25000,60000,150000,300000,400000,800000,1500000,12000000]},
  tv:{n:'تلویزیون رنگی',e:'📺',t:[],s:[5000,15000,50000,120000,250000,400000,700000,1200000,9000000]},
  fridge:{n:'یخچال',e:'🧊',t:[],s:[10000,30000,80000,200000,350000,500000,900000,2000000,15000000]},
  moto:{n:'موتور هوندا ۱۲۵',e:'🏍️',t:[],s:[10000,40000,120000,300000,600000,900000,1500000,4000000,35000000]},
};
const PUZZLES = [
  {groups:[
    {lv:0,title:'دهه‌شصتی‌های اصل',ex:'همه‌شون نماد دهه‌ی ۶۰ بودن',rule:{kind:'era_icon',tag:'dahe-60'},items:['gum','cassette','shoe','notebook']},
    {lv:1,title:'با یه اسکناس صدتومنی سال ۷۵',ex:'سال ۷۵ همه‌شون بین ۸۰ تا ۱۲۰ تومن بودن',rule:{kind:'price_band_at_year',year:1375,min:80,max:120},items:['soda','icepop','taxi','pofak']},
    {lv:2,title:'هزارتومنی‌شدگان دهه‌ی هشتاد',ex:'اولین بار توی دهه‌ی ۸۰ از ۱۰۰۰ تومن رد شدن',rule:{kind:'first_crossed',threshold:1000,from:1380,to:1389},items:['cinema','falafel','book','orange']},
    {lv:3,title:'چیزهایی که مامان‌بزرگ‌ها ازشون شاکی‌ان',ex:'از سال ۷۰ تا ۱۴۰۰ بیشتر از ۵۰۰ برابر گرون شدن',rule:{kind:'multiplier_between',a:1370,b:1400,minX:500},items:['coin','gold','apt','meat']},
  ]},
  {groups:[
    {lv:0,title:'زنگ اول، کلاس اول',ex:'همه‌شون لوازم مدرسه‌ان',rule:{kind:'era_icon',tag:'madrese'},items:['pencil','eraser','ruler','bag']},
    {lv:1,title:'عصرونه‌ی سال ۸۵',ex:'سال ۸۵ همه‌شون بین ۴۰۰ تا ۶۰۰ تومن بودن',rule:{kind:'price_band_at_year',year:1385,min:400,max:600},items:['sandwich','milk','chips','famsoda']},
    {lv:2,title:'پنج‌تومنی‌های خوش‌شانس',ex:'سال ۶۵ همه‌شون حدود ۵ تومن بودن',rule:{kind:'same_price_at_year',year:1365,target:5,tol:0.2},items:['egg','bus','lavash','stamp']},
    {lv:3,title:'جهیزیه‌هایی که میلیونی شدن',ex:'اولین بار توی دهه‌ی ۹۰ از یک میلیون تومن رد شدن',rule:{kind:'first_crossed',threshold:1000000,from:1390,to:1399},items:['washer','tv','fridge','moto']},
  ]},
];
const GROUP_POINTS=[1,2,3,4], FIRST_BLOOD=1, MAX_MISTAKES=4, TURN_SECONDS=45, MAX_TIMEOUTS=2;
const ENTRY_FEE=20, HOUSE_CUT=0.1, LOSS_CONSOLATION=5, RESCUE_TO=60;
const LV_NAMES=['زرد','سبز','آبی','بنفش'];
const TAUNTS=['سلام! آماده‌ای ببازی؟','اینو مامان‌بزرگمم بلد بود 😄','پیکان هم این‌قدر کند نبود!','یکی مونده بود، حیف!','دمت گرم، بازی خوبی بود'];
const BOT_TAUNTS=['حالا ببین کی می‌بره 😎','شانسی بود!','قیمت سال ۷۵ رو از حفظم','عجله نکن، وقت داری','ای بابا!'];

// ---------- helpers ----------
const fa = (n, d=1) => Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d});
function fmtT(v){
  if(v<1) return fa(v*10)+' ریال';
  if(v<1000) return fa(v)+' تومن';
  if(v<1e6) return fa(v/1000)+' هزار';
  if(v<1e9) return fa(v/1e6)+' میلیون';
  return fa(v/1e9)+' میلیارد';
}
const fy = y => Number(y).toLocaleString('fa-IR',{useGrouping:false});
const yShort = y => y>=1400 ? fy(y) : fy(y-1300);
const priceAt = (id,y) => { const i=YEARS.indexOf(y); return i<0?null:(P[id].s[i] ?? null); };
function firstAtOrAbove(id,th){ for(const y of YEARS){ const v=priceAt(id,y); if(v!=null && v>=th) return y; } return null; }
function satisfies(rule,id){
  const p=P[id];
  switch(rule.kind){
    case 'era_icon': return p.t.includes(rule.tag);
    case 'price_band_at_year': { const v=priceAt(id,rule.year); return v!=null && v>=rule.min && v<=rule.max; }
    case 'same_price_at_year': { const v=priceAt(id,rule.year); return v!=null && Math.abs(v-rule.target)<=rule.target*rule.tol; }
    case 'first_crossed': { const y=firstAtOrAbove(id,rule.threshold); return y!=null && y>=rule.from && y<=rule.to; }
    case 'multiplier_between': { const a=priceAt(id,rule.a), b=priceAt(id,rule.b); return a!=null && b!=null && b/a>=rule.minX; }
  }
  return false;
}
function relax(rule){
  switch(rule.kind){
    case 'price_band_at_year': return {...rule,min:rule.min*0.7,max:rule.max*1.3};
    case 'same_price_at_year': return {...rule,tol:rule.tol*1.5};
    case 'first_crossed': return {...rule,from:rule.from-5,to:rule.to+5};
    case 'multiplier_between': return {...rule,minX:rule.minX*0.7};
    default: return rule;
  }
}
// validatePuzzle — mirrors docs/logic/puzzle-generation.md (hard checks 1–4, soft check 5)
function validatePuzzle(pz){
  const all=pz.groups.flatMap(g=>g.items);
  const levels=pz.groups.map(g=>g.lv).sort().join();
  const checks=[];
  checks.push({ok:pz.groups.length===4 && levels==='0,1,2,3' && pz.groups.every(g=>g.items.length===4) && new Set(all).size===16, label:'شکل درست: ۴ دسته × ۴، سطح‌های زرد تا بنفش، ۱۶ جنس متفاوت'});
  checks.push({ok:pz.groups.every(g=>g.items.every(id=>satisfies(g.rule,id))), label:'هر جنس با قانون دسته‌ی خودش جور درمیاد'});
  const clashes=[];
  pz.groups.forEach(g=>all.forEach(id=>{ if(!g.items.includes(id) && satisfies(g.rule,id)) clashes.push(P[id].n+' ← '+g.title); }));
  checks.push({ok:clashes.length===0, label:clashes.length?'جواب یکتا نیست: '+clashes.join('، '):'جواب یکتاست: هیچ جنسی به دسته‌ی دیگه نمی‌خوره'});
  const near=[];
  pz.groups.forEach(g=>{ const r=relax(g.rule); all.forEach(id=>{ if(!g.items.includes(id) && satisfies(r,id)) near.push(P[id].n+' ≈ '+LV_NAMES[g.lv]); }); });
  checks.push({ok:near.length>=2, soft:true, label:'گول‌زننده‌ها (حداقل ۲): '+(near.length?near.join('، '):'هیچ')});
  return {ok:checks.filter(c=>!c.soft).every(c=>c.ok), checks};
}
function mulberry(seed){ return () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let rng=mulberry(Date.now()%100000);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function shuffleBoard(ids, groups){
  // no initial row may equal a full group (spec)
  for(let k=0;k<50;k++){
    const b=shuffle(ids); let bad=false;
    for(let r=0;r<b.length;r+=4){ const row=b.slice(r,r+4); if(row.length===4 && groups.some(g=>row.every(id=>g.items.includes(id)))) bad=true; }
    if(!bad) return b;
  }
  return shuffle(ids);
}
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

// ---------- state ----------
let coins = store.get('gh_coins',200);
let pIdx = store.get('gh_pidx',0) % PUZZLES.length;
let S = null, timerId=null, botId=null, passId=null;
const $ = id => document.getElementById(id);
function setCoins(v){ coins=Math.max(0,v); store.set('gh_coins',coins); $('coins').textContent=fa(coins,0); }
let toastId=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastId); toastId=setTimeout(()=>t.classList.remove('show'),1800); }

function newGame(mode){
  clearInterval(timerId); clearTimeout(botId); clearTimeout(passId);
  const pz=PUZZLES[pIdx];
  S = {mode, pz, board:shuffleBoard(pz.groups.flatMap(g=>g.items), pz.groups), solved:[], sel:[], tried:new Set(),
       mistakes:{me:0,bot:0}, score:{me:0,bot:0}, turn:'me', over:false, result:null, firstBlood:false,
       timeLeft:TURN_SECONDS, timeouts:0, chat:[], botPick:[], chartLv:3, coinDelta:0, entry:0};
  if(mode==='duel'){
    if(coins<ENTRY_FEE){ setCoins(RESCUE_TO); toast('سکه‌هات کم بود، '+fa(RESCUE_TO,0)+' سکه‌ی کمکی گرفتی'); }
    setCoins(coins-ENTRY_FEE); S.entry=ENTRY_FEE;
    S.turn = rng()<0.5 ? 'me' : 'bot';
    S.chat.push({who:'bot',text:'سلام! من ممدم. بزن بریم 👋'});
  }
  render();
  if(mode==='duel') startTurn();
}
const groupOf = id => S.pz.groups.find(g=>g.items.includes(id));
const unsolved = () => S.pz.groups.filter(g=>!S.solved.some(s=>s.g===g));
const locked = who => S.mistakes[who]>=MAX_MISTAKES;
const other = who => who==='me'?'bot':'me';

function startTurn(){
  clearInterval(timerId); clearTimeout(botId);
  if(S.over) return;
  S.timeLeft=TURN_SECONDS;
  if(S.turn==='me'){
    timerId=setInterval(()=>{
      S.timeLeft--; renderClock();
      if(S.timeLeft<=0){
        clearInterval(timerId); S.timeouts++;
        if(S.timeouts>=MAX_TIMEOUTS){ toast('دو بار وقتت تموم شد؛ باختی'); return endGame('bot'); }
        toast('وقتت تموم شد! نوبت رد شد'); S.sel=[]; passTurn();
      }
    },1000);
  } else {
    botId=setTimeout(botMove, 1400+rng()*1600);
  }
  render();
}
function passTurn(){
  const nxt=other(S.turn);
  if(!locked(nxt)) S.turn=nxt;
  startTurn();
}

function submit(by, ids){
  const key=ids.slice().sort().join('|');
  if(S.tried.has(key)){ if(by==='me') toast('اینو قبلاً امتحان کردین'); return false; }
  S.tried.add(key);
  const g=groupOf(ids[0]);
  const correct = ids.every(id=>groupOf(id)===g);
  if(correct){
    S.solved.push({g,by}); S.board=S.board.filter(id=>!g.items.includes(id)); S.sel=[];
    if(S.mode==='duel'){
      let pts=GROUP_POINTS[g.lv]; if(!S.firstBlood){ pts+=FIRST_BLOOD; S.firstBlood=true; }
      S.score[by]+=pts;
      toast((by==='me'?'آفرین! ':'ممد گرفت: ')+'+'+fa(pts,0)+' امتیاز');
    } else toast('آفرین!');
    if(S.solved.length===3){
      const last=unsolved()[0]; S.solved.push({g:last,by:null}); S.board=[];
      return endGame(), true;
    }
    if(S.mode==='duel'){ if(by==='me') S.timeouts=0; startTurn(); } else render();
    return true;
  }
  const maxOverlap=Math.max(...unsolved().map(u=>ids.filter(id=>u.items.includes(id)).length));
  S.mistakes[by]++;
  if(by==='me'){ shake(ids); S.sel=[]; }
  toast(maxOverlap===3 ? (by==='me'?'یکی مونده!':'ممد: یکی مونده بود!') : (by==='me'?'نه، این‌ها یه دسته نیستن':'ممد اشتباه کرد'));
  if(S.mode==='solo'){
    if(S.mistakes.me>=MAX_MISTAKES) return endGame(), false;
    render(); return false;
  }
  if(by==='me') S.timeouts=0;
  if(locked('me') && locked('bot')) return endGame(), false;
  passId=setTimeout(passTurn, by==='bot'?700:0);
  render();
  return false;
}
function shake(ids){
  ids.forEach(id=>{ const el=document.querySelector('[data-id="'+id+'"]'); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } });
}

function botMove(){
  if(S.over || S.turn!=='bot') return;
  const us=unsolved().sort((a,b)=>a.lv-b.lv);
  const pCorrect=0.33+0.12*S.solved.length;
  let pick=null;
  for(let k=0;k<20 && !pick;k++){
    let cand;
    const r=rng();
    if(r<pCorrect){ const g=us[rng()<0.7?0:Math.min(1,us.length-1)]; cand=g.items.slice(); }
    else if(r<pCorrect+0.35 && us.length>1){ const g=us[Math.floor(rng()*us.length)]; const rest=S.board.filter(id=>!g.items.includes(id)); cand=[...shuffle(g.items).slice(0,3), rest[Math.floor(rng()*rest.length)]]; }
    else cand=shuffle(S.board).slice(0,4);
    if(!S.tried.has(cand.slice().sort().join('|'))) pick=cand;
  }
  if(!pick) pick=us[0].items.slice();
  S.botPick=pick; render();
  botId=setTimeout(()=>{
    S.botPick=[];
    const ok=submit('bot',pick);
    if(ok && rng()<0.45) say('bot',BOT_TAUNTS[Math.floor(rng()*2)]);
  },1100);
}

function endGame(winnerOverride){
  clearInterval(timerId); clearTimeout(botId);
  // reveal the rest in level order
  unsolved().sort((a,b)=>a.lv-b.lv).forEach(g=>S.solved.push({g,by:null}));
  S.board=[]; S.sel=[]; S.botPick=[]; S.over=true;
  if(S.mode==='solo'){
    S.result={win:S.mistakes.me<MAX_MISTAKES};
  } else {
    let w=winnerOverride;
    if(!w){
      if(S.score.me!==S.score.bot) w=S.score.me>S.score.bot?'me':'bot';
      else if(S.mistakes.me!==S.mistakes.bot) w=S.mistakes.me<S.mistakes.bot?'me':'bot';
      else w='draw';
    }
    const pot=S.entry*2;
    let d=0;
    if(w==='me') d=Math.round(pot*(1-HOUSE_CUT));
    else if(w==='draw') d=Math.round(S.entry*(1-HOUSE_CUT));
    else d=LOSS_CONSOLATION;
    setCoins(coins+d); S.coinDelta=d-S.entry;
    S.result={winner:w};
    say('bot', w==='me'?'دمت گرم، بازی خوبی بود':'ای بابا! دفعه‌ی بعد 😄', true);
  }
  render();
  requestAnimationFrame(()=>$('result').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}));
}

function say(who,text,silent){
  S.chat.push({who,text}); if(S.chat.length>5) S.chat.shift();
  if(!silent) renderChat();
  if(who==='me' && !S.over && rng()<0.5) setTimeout(()=>{ if(S && !S.over){ say('bot',BOT_TAUNTS[2+Math.floor(rng()*3)]); } },1300);
}

// ---------- render ----------
function render(){
  $('tab-solo').setAttribute('aria-selected',S.mode==='solo');
  $('tab-duel').setAttribute('aria-selected',S.mode==='duel');
  renderStatus(); renderSolved(); renderBoard(); renderControls(); renderChat(); renderResult();
}
function dotsHtml(n){ let h=''; for(let i=0;i<MAX_MISTAKES;i++) h+='<span class="dot'+(i<n?' used':'')+'"></span>'; return '<span class="dots" aria-label="اشتباه‌ها">'+h+'</span>'; }
function renderStatus(){
  const el=$('status');
  if(S.mode==='solo'){
    el.innerHTML='<div class="solo-status">اشتباه‌های باقی‌مونده '+dotsHtml(S.mistakes.me)+'</div>'; return;
  }
  const act = w => !S.over && S.turn===w ? ' active':'';
  el.innerHTML='<div class="hud">'+
    '<div class="side'+act('me')+'"><div class="who"><span>تو</span>'+(locked('me')?'<span>قفل شد</span>':'')+'</div><div class="score num">'+fa(S.score.me,0)+'</div>'+dotsHtml(S.mistakes.me)+'</div>'+
    '<div class="clock num" id="clock"></div>'+
    '<div class="side bot'+act('bot')+'"><div class="who"><span>ممدِ ربات 🤖</span>'+(locked('bot')?'<span>قفل شد</span>':'')+'</div><div class="score num">'+fa(S.score.bot,0)+'</div>'+dotsHtml(S.mistakes.bot)+'</div>'+
    '<div class="turnbar"><i id="turnbar"></i></div></div>';
  renderClock();
}
function renderClock(){
  const c=$('clock'), b=$('turnbar'); if(!c) return;
  if(S.over){ c.innerHTML='پایان'; b.style.width='0'; return; }
  if(S.turn==='me'){ c.innerHTML=fa(S.timeLeft,0)+'<small>نوبت توئه</small>'; b.style.width=(S.timeLeft/TURN_SECONDS*100)+'%'; }
  else { c.innerHTML='…<small>ممد داره فکر می‌کنه</small>'; b.style.width='100%'; }
}
function renderSolved(){
  $('solved').innerHTML=S.solved.map(({g,by})=>{
    const names=g.items.map(id=>P[id].n).join('، ');
    const byTxt = S.mode==='duel' ? (by==='me'?'تو گرفتی · +'+fa(GROUP_POINTS[g.lv],0):by==='bot'?'ممد گرفت · +'+fa(GROUP_POINTS[g.lv],0):'بدون امتیاز') : '';
    return '<div class="row lv'+g.lv+'"><h3>'+g.title+'</h3><p>'+names+'</p><div class="ex">'+g.ex+'</div>'+(byTxt?'<div class="by">'+byTxt+'</div>':'')+'</div>';
  }).join('');
}
function renderBoard(){
  const myTurn = !S.over && (S.mode==='solo' || S.turn==='me');
  $('board').innerHTML=S.board.map(id=>{
    const sel=S.sel.includes(id), bp=S.botPick.includes(id);
    return '<button class="card'+(bp?' botpick':'')+'" data-id="'+id+'" aria-pressed="'+sel+'"'+(myTurn?'':' disabled')+'><span class="e" aria-hidden="true">'+P[id].e+'</span>'+P[id].n+'</button>';
  }).join('');
}
function renderControls(){
  if(S.over){ $('controls').innerHTML=''; return; }
  const myTurn = S.mode==='solo' || S.turn==='me';
  $('controls').innerHTML=
    '<button class="btn" id="b-shuffle">بُر زدن</button>'+
    '<button class="btn" id="b-clear"'+(S.sel.length?'':' disabled')+'>پاک کردن</button>'+
    '<button class="btn primary" id="b-submit"'+(S.sel.length===4&&myTurn?'':' disabled')+'>ثبت</button>';
}
function renderChat(){
  const el=$('chat');
  if(S.mode!=='duel'){ el.innerHTML=''; return; }
  el.innerHTML='<div class="panel"><h2>کل‌کل</h2>'+
    '<div class="chatlog">'+S.chat.map(m=>'<div class="msg '+m.who+'"><b>'+(m.who==='me'?'تو':'ممد')+'</b>'+m.text+'</div>').join('')+'</div>'+
    '<div class="taunts">'+TAUNTS.map((t,i)=>'<button class="chip" data-taunt="'+i+'"'+(S.over?' disabled':'')+'>'+t+'</button>').join('')+'</div>'+
    '<div class="lock"><span aria-hidden="true">🔒</span><input id="freechat" disabled placeholder="چت آزاد: فقط میز اختصاصی و با کد دعوت"></div></div>';
}
function renderResult(){
  const el=$('result');
  if(!S.over){ el.innerHTML=''; return; }
  let verdict, delta='';
  if(S.mode==='solo') verdict = S.result.win ? 'حل شد! 🎉' : 'این دفعه نشد';
  else {
    const w=S.result.winner;
    verdict = w==='me'?'بردی! 🏆':w==='bot'?'ممد برد':'مساوی';
    delta='<span class="delta num '+(S.coinDelta>=0?'plus':'minus')+'">'+(S.coinDelta>=0?'+':'−')+fa(Math.abs(S.coinDelta),0)+' سکه</span>';
  }
  const tabs=S.pz.groups.slice().sort((a,b)=>b.lv-a.lv).map(g=>'<button class="gtab lv'+g.lv+'" data-lv="'+g.lv+'" aria-selected="'+(S.chartLv===g.lv)+'">'+LV_NAMES[g.lv]+'</button>').join('');
  el.innerHTML='<div class="panel"><div class="result-head"><h2 class="verdict">'+verdict+'</h2>'+delta+'</div>'+
    '<p class="hint">سیر قیمت هر دسته، روی‌هم. محور عمودی لگاریتمیه چون قیمت‌ها از چند ریال تا میلیون‌ها تومن می‌رن.</p>'+
    '<div class="gtabs" role="tablist">'+tabs+'</div>'+
    '<div class="chart-box" id="chart"></div><div class="legend" id="legend"></div>'+
    '<div class="controls"><button class="btn accent" id="b-next">پازل بعدی</button><button class="btn" id="b-again">دوباره همین حالت</button></div>'+
    '<p class="hint">توی اپ واقعی از همین چارت یه کارت تصویری با کد دعوتت ساخته می‌شه برای اشتراک.</p></div>';
  drawChart();
}
function drawChart(){
  const g=S.pz.groups.find(x=>x.lv===S.chartLv);
  const W=560,H=300,m={l:74,r:18,t:20,b:34};
  const cols=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
  const vals=g.items.flatMap(id=>P[id].s.filter(v=>v!=null));
  let lo=Math.floor(Math.log10(Math.min(...vals))), hi=Math.ceil(Math.log10(Math.max(...vals)));
  if(hi===lo) hi++;
  const x=y=>m.l+(y-YEARS[0])/(YEARS.at(-1)-YEARS[0])*(W-m.l-m.r);
  const yv=v=>H-m.b-(Math.log10(v)-lo)/(hi-lo)*(H-m.t-m.b);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="نمودار قیمت دسته‌ی '+LV_NAMES[g.lv]+'" font-family="Vazirmatn,Tahoma,sans-serif">';
  for(let e=lo;e<=hi;e++){
    const yy=yv(10**e);
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(m.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmtT(10**e)+'</text>';
  }
  YEARS.forEach(y=>{ s+='<text x="'+x(y)+'" y="'+(H-m.b+20)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+yShort(y)+'</text>'; });
  // rule markers
  const r=g.rule, dash='stroke="var(--ink)" stroke-dasharray="4 4" stroke-width="1.2" opacity=".55"';
  const vline=(yr,label)=>{ s+='<line x1="'+x(yr)+'" x2="'+x(yr)+'" y1="'+m.t+'" y2="'+(H-m.b)+'" '+dash+'/><text x="'+(x(yr)+4)+'" y="'+(m.t+10)+'" font-size="11" fill="var(--ink)">'+label+'</text>'; };
  if(r.kind==='price_band_at_year'||r.kind==='same_price_at_year') vline(r.year,'سال '+yShort(r.year));
  if(r.kind==='multiplier_between'){ vline(r.a,'سال '+yShort(r.a)); vline(r.b,'سال '+yShort(r.b)); }
  if(r.kind==='first_crossed' && Math.log10(r.threshold)>=lo && Math.log10(r.threshold)<=hi){
    const yy=yv(r.threshold); s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" '+dash+'/><text x="'+(m.l+4)+'" y="'+(yy-5)+'" font-size="11" fill="var(--ink)">مرز '+fmtT(r.threshold)+'</text>';
  }
  g.items.forEach((id,i)=>{
    let d='', pen=false;
    YEARS.forEach((y,k)=>{ const v=P[id].s[k]; if(v==null){ pen=false; return; } d+=(pen?'L':'M')+x(y).toFixed(1)+' '+yv(v).toFixed(1)+' '; pen=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+cols[i]+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    YEARS.forEach((y,k)=>{ const v=P[id].s[k]; if(v!=null) s+='<circle cx="'+x(y).toFixed(1)+'" cy="'+yv(v).toFixed(1)+'" r="3" fill="'+cols[i]+'"><title>'+P[id].n+' · '+fy(y)+' · '+fmtT(v)+'</title></circle>'; });
  });
  s+='</svg>';
  $('chart').innerHTML=s;
  $('legend').innerHTML=g.items.map((id,i)=>{
    const k=P[id].s.findLastIndex(v=>v!=null);
    return '<div><i style="background:'+cols[i]+'"></i><span>'+P[id].e+' '+P[id].n+'</span><em class="num">'+yShort(YEARS[k])+': '+fmtT(P[id].s[k])+'</em></div>';
  }).join('');
}
function renderLogic(){
  const v=validatePuzzle(PUZZLES[pIdx]);
  $('logic').innerHTML='<summary>منطق پازل '+fa(pIdx+1,0)+' از '+fa(PUZZLES.length,0)+': '+(v.ok?'معتبر ✓':'نامعتبر ✗')+'</summary>'+
    '<ul class="checks">'+v.checks.map(c=>'<li><span class="'+(c.ok?'ok':'bad')+'">'+(c.ok?'✓':(c.soft?'!':'✗'))+'</span><span>'+c.label+'</span></li>').join('')+
    PUZZLES[pIdx].groups.map(g=>'<li><span class="ok">·</span><span>'+LV_NAMES[g.lv]+': <code>'+JSON.stringify(g.rule)+'</code></span></li>').join('')+'</ul>'+
    '<p class="hint" style="margin-top:8px">این همون <code>validatePuzzle</code> مستند <code>docs/logic/puzzle-generation.md</code> است که موقع لود صفحه اجرا می‌شه.</p>';
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(card && !card.disabled && S && !S.over){
    const id=card.dataset.id, i=S.sel.indexOf(id);
    if(i>=0) S.sel.splice(i,1); else if(S.sel.length<4) S.sel.push(id);
    renderBoard(); renderControls(); return;
  }
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='b-shuffle'){ S.board=shuffle(S.board); renderBoard(); }
  else if(t.id==='b-clear'){ S.sel=[]; renderBoard(); renderControls(); }
  else if(t.id==='b-submit' && S.sel.length===4){ submit('me',S.sel.slice()); }
  else if(t.id==='tab-solo'||t.id==='tab-duel'){
    const mode=t.id==='tab-solo'?'solo':'duel';
    if(S && S.mode==='duel' && !S.over && S.solved.length+S.mistakes.me+S.mistakes.bot>0) toast('بازی قبلی رو ترک کردی؛ سکه‌ی ورودی برنگشت');
    newGame(mode);
  }
  else if(t.id==='b-next'){ pIdx=(pIdx+1)%PUZZLES.length; store.set('gh_pidx',pIdx); renderLogic(); newGame(S.mode); window.scrollTo({top:0}); }
  else if(t.id==='b-again'){ newGame(S.mode); window.scrollTo({top:0}); }
  else if(t.dataset.taunt!=null){ say('me',TAUNTS[+t.dataset.taunt]); }
  else if(t.dataset.lv!=null){ S.chartLv=+t.dataset.lv; renderResult(); }
});

setCoins(coins);
renderLogic();
newGame('solo');
})();
</script>
