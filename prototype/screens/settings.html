<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوزاری — تنظیمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--card);border-radius:999px;transition:background .15s}
.switch i::before{content:'';position:absolute;width:20px;height:20px;top:3px;right:3px;background:var(--surface);border-radius:50%;box-shadow:var(--shadow);transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::before{transform:translateX(-18px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="home.html">دوزاری <span aria-hidden="true">🪙</span></a>
    <span class="coins num"><span class="coin-dot"></span><span id="coins">۲۰۰</span></span>
  </header>
  <h1 class="screen-title">تنظیمات</h1>

  <div class="panel">
    <div class="switch-row"><span>صدا</span><label class="switch"><input type="checkbox" id="sound" checked><i></i></label></div>
    <div class="switch-row"><span>لرزش</span><label class="switch"><input type="checkbox" id="vibrate" checked><i></i></label></div>
  </div>

  <div class="panel">
    <button class="btn block" id="replay">▶️ دیدن دوباره‌ی آموزش</button>
  </div>

  <div class="panel">
    <h2>درباره و پشتیبانی</h2>
    <p class="hint">دوزاری، بازی نوستالژی قیمت‌های ایران. نسخه‌ی نمایشی ۰٫۱ — قیمت‌ها نمونه‌ان.</p>
    <a class="btn block" href="https://t.me/" target="_blank" rel="noopener">پشتیبانی در تلگرام</a>
  </div>

  <div class="panel">
    <button class="btn danger block" id="logout">خروج از حساب</button>
    <button class="btn danger block" id="delete">حذف حساب کاربری</button>
  </div>
</div>

<nav class="bottom" aria-label="ناوبری اصلی">
  <a href="home.html"><span class="e" aria-hidden="true">🏠</span>خانه</a>
  <a href="profile.html"><span class="e" aria-hidden="true">👤</span>پروفایل</a>
  <a class="active" href="settings.html"><span class="e" aria-hidden="true">⚙️</span>تنظیمات</a>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
  $('replay').addEventListener('click', () => location.href = 'onboarding.html');
  $('logout').addEventListener('click', () => { if (confirm('از حساب خارج بشی؟')) toast('خارج شدی (دمو)'); });
  $('delete').addEventListener('click', () => { if (confirm('مطمئنی؟ این کار برگشت‌ناپذیره.')) toast('درخواست حذف ثبت شد (دمو)'); });
  try{ $('coins').textContent = Number(JSON.parse(localStorage.getItem('gh_coins')||'200')).toLocaleString('fa-IR'); }catch(e){}
})();
</script>
</body>
</html>
