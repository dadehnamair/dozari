<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دوزاری — چت مسابقه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
.mock-board{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted)}
.fab{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--accent-grad);color:var(--accent-ink);border:0;font-size:22px;box-shadow:0 8px 20px -6px rgba(108,92,231,.6);display:flex;align-items:center;justify-content:center;z-index:15}
.fab .badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:10.5px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(22,19,39,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:16}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(22,19,39,.2);transform:translateY(105%);transition:transform .25s ease;z-index:17;max-height:75vh;display:flex;flex-direction:column}
.drawer.open{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.drawer-body{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.chatlog{display:flex;flex-direction:column;gap:6px;min-height:80px}
.msg{max-width:80%;padding:7px 12px;border-radius:14px;font-size:13.5px;background:var(--card);align-self:flex-end}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-start}
.msg b{font-size:11px;display:block;opacity:.75;font-weight:700}
.taunts{display:flex;gap:6px;flex-wrap:wrap}
.lock{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.lock input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.7-4.2 4-6.4 7.5-6.4s6.8 2.2 7.5 6.4"/></symbol>
  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5c.6-3.4 3-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.3 14.6c2 .2 3.7 1.8 4.2 4.9"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h13M20 17h0"/><circle cx="15" cy="7" r="2.2"/><circle cx="7" cy="12" r="2.2"/><circle cx="16.5" cy="17" r="2.2"/></symbol>
  <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><path d="M12 9.3v5.4M10.4 10.4h2.5a1.3 1.3 0 0 1 0 2.6h-1.8a1.3 1.3 0 0 0 0 2.6h2.5"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5.5h16a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H9l-4.2 3.4a.5.5 0 0 1-.8-.4V16H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/><path d="M7.5 9.5h9M7.5 12.5h6"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v5.5a5 5 0 0 1-10 0V4Z"/><path d="M7 6H4.5a1 1 0 0 0-1 1.2c.4 2.2 1.8 3.6 3.8 4M17 6h2.5a1 1 0 0 1 1 1.2c-.4 2.2-1.8 3.6-3.8 4"/><path d="M12 14.5V17M9 20.5h6M8.8 20.5c0-2 1.4-2.6 3.2-2.6s3.2.6 3.2 2.6"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="1.8"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></symbol>
  <symbol id="mic-off" viewBox="0 0 24 24"><path d="M9 5.5a3 3 0 0 1 6 0v6a3 3 0 0 1-.3 1.3M15 12.2V5.5"/><path d="M6 11v1a6 6 0 0 0 9.3 5M18 11v1c0 .8-.1 1.5-.4 2.2"/><path d="M12 18v3M9 21h6"/><path d="M4 4l16 16"/></symbol>
  <symbol id="ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m6 6 12 12"/></symbol>
  <symbol id="swords" viewBox="0 0 24 24"><path d="M4 4l7 7-2 2-7-7V4h2Z"/><path d="M20 4l-7 7 2 2 7-7V4h-2Z"/><path d="m11 13-6.5 6.5M13 13l6.5 6.5"/><path d="M4.5 17.5h2v2h-2zM17.5 17.5h2v2h-2z"/></symbol>
  <symbol id="key" viewBox="0 0 24 24"><circle cx="7.5" cy="14.5" r="3.5"/><path d="m10 12 8.5-8.5M15.5 6.5l2 2M13 9l2 2"/></symbol>
  <symbol id="gift" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="4" rx="1"/><rect x="5.5" y="13" width="13" height="7" rx="1"/><path d="M12 9v11"/><path d="M12 9c-1-3-5-4-5-1.3S9.5 9 12 9Zm0 0c1-3 5-4 5-1.3S14.5 9 12 9Z"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3.5 14.5 9l6 .8-4.3 4.1 1 6-5.2-2.8-5.2 2.8 1-6-4.3-4.1 6-.8Z"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.5c0 4.4-3 7.4-7 9-4-1.6-7-4.6-7-9V6Z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
  <symbol id="pencil" viewBox="0 0 24 24"><path d="m4 20 .8-3.6L15.5 6l3.6 3.6-10.7 10.7z"/><path d="m13.2 7.8 3.6 3.6"/></symbol>
  <symbol id="chevron-right" viewBox="0 0 24 24"><path d="m9 6 7 6-7 6"/></symbol>
  <symbol id="chevron-left" viewBox="0 0 24 24"><path d="m15 6-7 6 7 6"/></symbol>
  <symbol id="dashboard" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.3"/><rect x="13" y="4" width="7" height="4.5" rx="1.3"/><rect x="13" y="10.5" width="7" height="9.5" rx="1.3"/><rect x="4" y="13" width="7" height="7" rx="1.3"/></symbol>
  <symbol id="puzzle" viewBox="0 0 24 24"><path d="M9 4.5h4.5a1.3 1.3 0 0 1 0 3 1.4 1.4 0 0 0 0 2.8 1.3 1.3 0 0 1 0 2.7H9V9.6a1.4 1.4 0 0 0-2.8 0v3.4H4.5V9a1.3 1.3 0 0 1 0-2.6H9V4.5Z"/><path d="M9 13h4.5V17a1.4 1.4 0 0 0 2.8 0V13H19a1.3 1.3 0 0 1 1.3 1.3v2.4a1.3 1.3 0 0 1-2.6 0 1.4 1.4 0 0 0-2.8 0 1.3 1.3 0 0 1-2.6 0V13H9Z" opacity=".55"/></symbol>
  <symbol id="list-check" viewBox="0 0 24 24"><path d="m4 6.5 1.6 1.6L8 5.5M4 13l1.6 1.6L8 12M4 19.5l1.6 1.6L8 18.5"/><path d="M11 6.5h9M11 13h9M11 19.5h9"/></symbol>
  <symbol id="wallet" viewBox="0 0 24 24"><rect x="3.5" y="6.5" width="17" height="12" rx="2"/><path d="M3.5 10h17"/><circle cx="16.5" cy="14" r="1.3"/></symbol>

<div class="wrap">
  <header class="top">
    <a class="logo" href="home.html">دوزاری <span aria-hidden="true">🪙</span></a>
    <span class="coins num"><span class="coin-dot"></span><span id="coins">۲۰۰</span></span>
  </header>
  <h1 class="screen-title">چت مسابقه</h1>
  <p class="screen-sub">توی صفحه‌ی واقعی مسابقه، این یه دکمه‌ی شناور روی گوشه‌ی صفحه‌ست که با تپ باز می‌شه — نه یه صفحه‌ی جدا. این‌جا برای دیدن محتواش جدا آوردیمش.</p>

  <div class="mock-board">
    <span style="font-size:34px" aria-hidden="true">🧩</span>
    <p>صفحه‌ی مسابقه (تخته‌ی پازل) این پشته</p>
    <p class="hint">دکمه‌ی چت شناور رو پایین‌چپ صفحه بزن</p>
  </div>
</div>

<button class="fab" id="fab" aria-label="باز کردن چت"><svg class="icon" style="width:24px;height:24px" aria-hidden="true"><use href="#chat"></use></svg><span class="badge" id="unread">۲</span></button>
<div class="drawer-backdrop" id="backdrop"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="چت مسابقه">
  <div class="drawer-head">
    <div class="seg" role="tablist" style="width:200px">
      <button aria-selected="true" data-ch="all">همه</button>
      <button aria-selected="false" data-ch="team">تیم من</button>
    </div>
    <button class="btn sm" id="closeDrawer">بستن <svg class="icon"><use href="#x"></use></svg></button>
  </div>
  <div class="drawer-body">
    <div class="chatlog" id="chatlog"></div>
    <div class="taunts" id="taunts"></div>
    <div class="lock"><span aria-hidden="true">🔒</span><input disabled placeholder="چت آزاد: فقط با کد دعوت باز می‌شه (پروفایل ‹ چت آزاد)"></div>
  </div>
</div>

<nav class="bottom" aria-label="ناوبری اصلی">
  <a href="home.html"><svg class="icon" aria-hidden="true"><use href="#home"></use></svg>خانه</a>
  <a href="profile.html"><svg class="icon" aria-hidden="true"><use href="#user"></use></svg>پروفایل</a>
  <a href="settings.html"><svg class="icon" aria-hidden="true"><use href="#settings"></use></svg>تنظیمات</a>
</nav>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAUNTS = ['یه دوزاری بنداز، شروع کنیم!','این یکی رو مامان‌بزرگمم بلد بود 😄','یکی مونده بیفته!','دمت گرم، بازی خوبی بود'];
  let chat = [
    {who:'bot', text:'سلام! من ممدم. بزن بریم 👋'},
    {who:'me', text:'یه دوزاری بنداز، شروع کنیم!'},
    {who:'bot', text:'دوزاریت هنوز تو راهه؟'},
  ];
  function renderChat(){
    $('chatlog').innerHTML = chat.map(m => '<div class="msg '+(m.who==='me'?'me':'')+'"><b>'+(m.who==='me'?'تو':'ممد')+'</b>'+m.text+'</div>').join('');
    $('chatlog').scrollTop = $('chatlog').scrollHeight;
  }
  $('taunts').innerHTML = TAUNTS.map((t,i) => '<button class="chip" data-taunt="'+i+'">'+t+'</button>').join('');
  $('taunts').addEventListener('click', e => {
    const b = e.target.closest('[data-taunt]'); if (!b) return;
    chat.push({who:'me', text:TAUNTS[+b.dataset.taunt]}); renderChat();
    setTimeout(() => { chat.push({who:'bot', text:'ای بابا!'}); renderChat(); }, 900);
  });
  function openDrawer(){ $('drawer').classList.add('open'); $('backdrop').classList.add('open'); $('unread').style.display='none'; }
  function closeDrawer(){ $('drawer').classList.remove('open'); $('backdrop').classList.remove('open'); }
  $('fab').addEventListener('click', openDrawer);
  $('closeDrawer').addEventListener('click', closeDrawer);
  $('backdrop').addEventListener('click', closeDrawer);
  document.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-ch]').forEach(x => x.setAttribute('aria-selected', x===b));
  }));
  renderChat();
  try{ $('coins').textContent = Number(JSON.parse(localStorage.getItem('gh_coins')||'200')).toLocaleString('fa-IR'); }catch(e){}
})();
</script>
</body>
</html>
