plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ir.dozari.bgnotify'
version = '0.1.0'

android {
  namespace "ir.dozari.bgnotify"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // AndroidX WorkManager: a build-time library, not Google Play Services; it needs no Google account or network service.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
}
